{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="mb-4">
        <span class="page-label">
            Copyediting
        </span>

        <h1 class="h3 fw-bold mt-2 mb-1">
            Request Copyediting Correction
        </h1>

        <p class="text-muted mb-0">
            {{ paper.title }}
        </p>
    </div>

    <div class="detail-card">

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label
                    for="{{ form.correction_note.id_for_label }}"
                    class="form-label fw-semibold"
                >
                    {{ form.correction_note.label }}
                </label>

                {{ form.correction_note }}

                {% if form.correction_note.errors %}
                    <div class="text-danger mt-2">
                        {{ form.correction_note.errors }}
                    </div>
                {% endif %}
            </div>

            <div class="d-flex gap-2">
                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Send Correction Request
                </button>

                <a
                    href="{% url 'admin_paper_detail' paper.pk %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
